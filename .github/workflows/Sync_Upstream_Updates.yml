
name: Sync Upstream Updates

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/RealDeco/xiaozhi-esphome.git
          git fetch upstream main

      - name: Update sync branch
        run: |
          git checkout -B upstream-sync upstream/main
          git push --force origin upstream-sync

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PR=$(gh pr list \
            --repo "$GH_REPO" \
            --base main \
            --head upstream-sync \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR" ]; then
            gh pr create \
              --repo "$GH_REPO" \
              --base main \
              --head upstream-sync \
              --title "Sync upstream updates" \
              --body "Automated sync from RealDeco/xiaozhi-esphome."
          else
            echo "Updated existing PR #$PR"
          fi
